<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.Title}} · Controle de Gastos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B2F4A'/><path d='M8 22l6-7 4 4 7-9' stroke='%23C6EFCE' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
{{if ne .Nav "login"}}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">Controle de Gastos</a>
    <nav>
      <a href="/" {{if eq .Nav "dashboard"}}class="on"{{end}}>Dashboard</a>
      <a href="/receitas" {{if and (eq .Nav "list") .IsIncome}}class="on"{{end}}>Receitas</a>
      <a href="/gastos" {{if and (eq .Nav "list") (not .IsIncome)}}class="on"{{end}}>Gastos</a>
      <a href="/recorrentes" {{if eq .Nav "recurrences"}}class="on"{{end}}>Recorrentes</a>
      <a href="/dividas" {{if eq .Nav "debts"}}class="on"{{end}}>Dívidas</a>
      <a href="/config" {{if eq .Nav "config"}}class="on"{{end}}>Config</a>
    </nav>
  </div>
</header>
{{end}}
<main class="wrap">
  {{with .Flash}}<div class="flash" role="status">{{.}}</div>{{end}}
  {{template "content" .}}
</main>
<script src="/static/app.js" defer></script>
{{block "scripts" .}}{{end}}
</body>
</html>
